# ==============================================================================
# RecallAI — Production-like Containerized Multi-Service Composition
# Services:
#   1. backend      — FastAPI REST & LangGraph Assistant (/api/v1)
#   2. frontend     — Next.js Web UI (:3000)
#   3. voice-worker — Optional LiveKit Voice Agent Worker
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recallai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - DEMO_MODE=false
    env_file:
      - path: .env
        required: false
    volumes:
      - ./downloades:/app/downloades
      - ./vector_db:/app/vector_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_STANDALONE=true
    container_name: recallai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy

  voice-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recallai-voice-worker
    restart: unless-stopped
    command: ["python", "voice_agent.py", "start"]
    env_file:
      - path: .env
        required: false
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - voice
